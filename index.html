<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب إجازة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>طلب إجازة</h1>
  <p class="sub">املأ البيانات التالية وسيصل طلبك إلى الإدارة.</p>

  <form id="leaveForm" novalidate>
    <label>الاسم الكامل
      <input type="text" name="name" required autocomplete="name">
    </label>

    <div class="row">
      <label>الرقم الوظيفي
        <input type="text" name="empId" required inputmode="numeric">
      </label>
      <label>القسم
        <input type="text" name="dept" required>
      </label>
    </div>

    <label>نوع الإجازة
      <select name="type" required>
        <option value="">اختر...</option>
        <option>إجازة سنوية</option>
        <option>إجازة مرضية</option>
        <option>إجازة طارئة</option>
        <option>إجازة بدون راتب</option>
        <option>أخرى</option>
      </select>
    </label>

    <div class="row">
      <label>من تاريخ
        <input type="date" name="start" required>
      </label>
      <label>إلى تاريخ
        <input type="date" name="end" required>
      </label>
    </div>

    <p class="days" id="days" aria-live="polite"></p>

    <label>السبب (اختياري)
      <textarea name="reason" rows="3"></textarea>
    </label>

    <p class="error" id="error" role="alert"></p>
    <button type="submit">إرسال الطلب</button>
  </form>

  <section id="done" class="done" hidden>
    <h2>تم تسجيل طلبك ✔</h2>
    <dl id="summary"></dl>
    <button type="button" id="again">طلب جديد</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
