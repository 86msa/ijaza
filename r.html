<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الرد على طلب إجازة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>الرد على طلب إجازة</h1>

  <section id="ok" class="done" hidden>
    <dl id="summary"></dl>
    <div class="actions">
      <a id="yes" class="btn big yes" target="_blank" rel="noopener">✅ قبول</a>
      <a id="no" class="btn big no" target="_blank" rel="noopener">❌ رفض</a>
    </div>
    <p class="note">سيُفتح واتساب على محادثة الموظف برسالة جاهزة، اضغط «إرسال» فيه.</p>
  </section>

  <p id="bad" class="error" hidden>الرابط غير صحيح أو ناقص. افتحه كما وصلك في رسالة واتساب.</p>
</main>
<script>
  // صيغة الرابط: r.html#<رقم الموظف بدون 964 والصفر>-<من YYYYMMDD>-<إلى YYYYMMDD>
  const m = location.hash.match(/^#(7\d{9})-(\d{8})-(\d{8})$/);
  if (!m) {
    document.getElementById('bad').hidden = false;
  } else {
    const phone = '964' + m[1];
    const fmt = (s) => `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}`;
    const start = fmt(m[2]), end = fmt(m[3]);
    const days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
    const ltr = (s) => `\u2066${s}\u2069`;
    const period = start === end ? ltr(start) : `من ${ltr(start)} إلى ${ltr(end)}`;
    const wa = (t) => `https://wa.me/${phone}?text=${encodeURIComponent(t)}`;

    document.getElementById('yes').href =
      wa(`مرحبًا،\nتمت الموافقة على طلب إجازتك ✅\nالتاريخ: ${period} (${days} يوم)`);
    document.getElementById('no').href =
      wa(`مرحبًا،\nنعتذر، لم تتم الموافقة على طلب إجازتك ❌\nالتاريخ: ${period}`);

    const rows = [['رقم الموظف', '0' + m[1]], ['التاريخ', period], ['عدد الأيام', days]];
    const dl = document.getElementById('summary');
    for (const [k, v] of rows) {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    }
    document.getElementById('ok').hidden = false;
  }
</script>
</body>
</html>
